name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Die Tests brauchen nur Lesezugriff auf den Code (das Token bekommt keine Schreibrechte).
permissions:
  contents: read

jobs:
  python:
    name: Python (Home Assistant ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    # Die Tests dauern etwa 3 Minuten, die Mutationsprobe (nur im ersten Lauf) rund 12; hängt ein Lauf, soll er nicht 6 Stunden Laufzeit verbrauchen
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Zwei Versionen (seit 1.60.0): die ältere wie bisher, dazu eine aktuelle. Die Nutzer fahren die aktuelle; Mängel, die nur dort
        # auftreten (veraltete Schnittstellen, neue Prüf-Bibliothek), blieben bis 1.59.0 unbemerkt. Die Mutationsprobe läuft einmal.
        include:
          - homeassistant: "2026.2"
            python: "3.13"
            requirements: requirements_test.txt
            mutation: true
          - homeassistant: "2026.10"
            python: "3.14"
            requirements: requirements_test_current.txt
            mutation: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Node.js (für die Prüfung der Panel-Texte)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Abhängigkeiten
        # Die Kamera-Komponente (Abhängigkeit der HomeKit-Bridge) meldet ohne libturbojpeg nur eine Warnung; nicht nötig
        run: pip install -r ${{ matrix.requirements }}

      - name: Pyflakes
        run: python -m pyflakes custom_components/alarmageddon/*.py tests/*.py scripts/*.py

      - name: Tests
        run: python -m pytest -q

      - name: Mutationsprobe der Sicherheitstests
        # Baut je eine Schutzmassnahme aus und prüft, dass die Tests es merken (scripts/mutation_check.py)
        if: matrix.mutation
        run: python scripts/mutation_check.py

  panel:
    name: Panel (Playwright)
    runs-on: ubuntu-latest
    # Die 59 Suiten brauchen auf dem Runner rund 20 bis 25 Minuten (die Grenze von 20 Minuten brach den Lauf ab); jede neue Suite verlängert sie
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tests/panel
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Syntax der Panel-Dateien
        # node --check allein findet in Modulen keine Syntaxfehler (LEARNINGS)
        run: for f in ../../custom_components/alarmageddon/panel/*.js; do node --input-type=module --check < "$f"; done

      - name: Abhängigkeiten
        run: npm ci

      # Zuerst nur der Browser (Download von Playwright, kein apt): Die Paketquellen des Runners waren mehrfach
      # nicht erreichbar, und "--with-deps" hielt die Prüfung dann 10 Minuten fest. Die Systembibliotheken
      # bringt das Runner-Abbild mit; fehlen sie, holt der zweite Aufruf sie nach.
      - name: Chromium
        timeout-minutes: 8
        run: |
          npx playwright-core install chromium
          node -e "const {chromium}=require('playwright-core');chromium.launch().then(b=>b.close()).then(()=>console.log('Chromium startet'))" || npx playwright-core install --with-deps chromium

      - name: Suiten
        run: node run.mjs

      - name: Bildschirmfotos bei Fehlern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panel-screenshots
          path: tests/panel/output
